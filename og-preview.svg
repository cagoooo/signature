<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">學生活動肖像使用授權同意書｜家長線上簽名系統</title>
  <desc id="desc">桃園市龍潭區石門國民小學提供的家長線上簽名系統分享預覽圖</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff" />
      <stop offset="0.58" stop-color="#ffffff" />
      <stop offset="1" stop-color="#fff7fc" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6" />
      <stop offset="0.5" stop-color="#8b5cf6" />
      <stop offset="1" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="orbBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.38" />
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="orbPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9a8d4" stop-opacity="0.35" />
      <stop offset="1" stop-color="#ec4899" stop-opacity="0.04" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#4c1d95" flood-opacity="0.14" />
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#312e81" flood-opacity="0.16" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#page)" />
  <circle cx="1080" cy="-10" r="270" fill="url(#orbBlue)" />
  <circle cx="110" cy="650" r="250" fill="url(#orbPink)" />
  <path d="M0 104C180 44 306 116 454 70S734 8 930 80" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.75" />
  <path d="M280 630c170-130 313-45 450-124 94-54 132-124 210-167" fill="none" stroke="#e0e7ff" stroke-width="3" opacity="0.8" />

  <g filter="url(#shadow)">
    <rect x="62" y="58" width="1076" height="514" rx="42" fill="#ffffff" opacity="0.92" />
    <rect x="62" y="58" width="12" height="514" rx="6" fill="url(#accent)" />
  </g>

  <g font-family="Microsoft JhengHei, Microsoft JhengHei UI, Noto Sans TC, sans-serif">
    <rect x="116" y="106" width="358" height="44" rx="22" fill="#eef2ff" />
    <circle cx="142" cy="128" r="7" fill="#8b5cf6" />
    <text x="164" y="136" fill="#5b21b6" font-size="20" font-weight="700">桃園市龍潭區石門國民小學</text>

    <text x="116" y="238" fill="#172554" font-size="62" font-weight="900">學生活動肖像</text>
    <text x="116" y="314" fill="#172554" font-size="62" font-weight="900">使用授權同意書</text>
    <rect x="116" y="346" width="350" height="8" rx="4" fill="url(#accent)" />
    <text x="116" y="402" fill="#475569" font-size="26" font-weight="600">家長可透過手機完成線上簽署</text>
    <text x="116" y="442" fill="#64748b" font-size="22" font-weight="500">完成後可下載 PDF 留存</text>

    <rect x="116" y="488" width="270" height="48" rx="24" fill="#172554" />
    <text x="151" y="520" fill="#ffffff" font-size="20" font-weight="700">家長線上簽名系統</text>

    <text x="840" y="526" fill="#64748b" font-size="18" font-weight="600">cagoooo.github.io/signature/</text>
  </g>

