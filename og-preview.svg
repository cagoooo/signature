    <rect x="24" y="24" width="264" height="264" rx="28" fill="#ffffff" />
    <path d="M72 177c29 0 28-56 58-69 22-10 31 7 29 27-4 27-35 53-44 73-9 24 14 35 35 23 32-17 49-58 70-87 16-22 40-40 53-20 14 22-4 52-25 69-26 21-62 32-88 47-22 13-39 26-30 43 8 14 31 16 56 4 31-14 60-38 91-61" fill="none" stroke="url(#accent)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M76 240h160" fill="none" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round" />
    <path d="M228 218l34 34-16 16-34-34z" fill="#fef3c7" />
    <path d="M212 202l16 16-17 17-16-16z" fill="#f59e0b" />
    <circle cx="70" cy="70" r="14" fill="#dbeafe" />
    <circle cx="106" cy="70" r="14" fill="#ede9fe" />
    <circle cx="142" cy="70" r="14" fill="#fce7f3" />
  </g>
